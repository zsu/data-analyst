  // A real date axis when the builder passed ISO dates (time series): spacing follows the calendar, so
  // a gap in the dates is a gap on the axis, and recessions can be shaded at their true dates.
  const T = (spec.dates && spec.dates.length === cats.length && spec.dates.every(d => !isNaN(Date.parse(d))))
    ? spec.dates.map(d => Date.parse(d)) : null;
  const t0 = T ? T[0] : 0, t1 = T ? T[T.length - 1] : 1;
  const X = T ? (i => ml + (t1 === t0 ? pw / 2 : (T[i] - t0) / (t1 - t0) * pw))
              : (i => ml + (cats.length === 1 ? pw / 2 : i * pw / (cats.length - 1)));
  const Xt = t => ml + (t - t0) / ((t1 - t0) || 1) * pw;
  const Y = v => mt + ph - (v - lo) / (hi - lo) * ph;
  const svg = el("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`}, box);
  if (T && spec.recessions) spec.recessions.forEach(([a, b]) => {
    const s = Math.max(Date.parse(a), t0), e0 = new Date(Date.parse(b)); e0.setUTCMonth(e0.getUTCMonth() + 1);
    const e = Math.min(e0.getTime(), t1);
    if (e > s) el("rect", {x: Xt(s), y: mt, width: Math.max(1, Xt(e) - Xt(s)), height: ph, class: "rec"}, svg);
  });
  ticks.forEach(t => {
    el("line", {x1: ml, x2: ml + pw, y1: Y(t), y2: Y(t), class: Math.abs(t) < 1e-12 ? "base" : "grid"}, svg);
    el("text", {x: ml - 8, y: Y(t) + 4, "text-anchor": "end"}, svg).textContent = axisFmt(t, spec.format);
  });
  if (T) {
    // year ticks at a step that fits (1, 2, 5, 10, 20 years); months when the span is under two years
    const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear(), span = (t1 - t0) / 31557600000;
    let labels = [];
    if (span < 2) {
      for (let d = new Date(Date.UTC(y0, new Date(t0).getUTCMonth(), 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + 3))
        labels.push([d.getTime(), d.toLocaleString("en-US", {month: "short", timeZone: "UTC"}) + " " + d.getUTCFullYear()]);
    } else {
      const fit = Math.max(1, Math.floor(pw / (tw("2000") + 18)));
      const step = [1, 2, 5, 10, 20, 50].find(s => (y1 - y0) / s + 1 <= fit) || 100;
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) labels.push([Date.UTC(y, 0, 1), String(y)]);
    }
    const lw = Math.max(...labels.map(l => tw(l[1]))) + 10;
    labels = labels.filter((l, i) => l[0] >= t0 && l[0] <= t1 && (i === 0 || Xt(l[0]) - Xt(labels[i - 1][0]) >= lw));
    labels.forEach(([t, s]) => {
      el("line", {x1: Xt(t), x2: Xt(t), y1: mt + ph, y2: mt + ph + 4, class: "base"}, svg);
      el("text", {x: Xt(t), y: H - 10, "text-anchor": "middle"}, svg).textContent = s;
    });
  } else {
    const maxLab = Math.max(...cats.map(c => tw(c))) + 10;
    const every = Math.max(1, Math.ceil(cats.length * maxLab / pw));
    cats.forEach((c, i) => {
      if (i % every && i !== cats.length - 1) return;
      if (i !== cats.length - 1 && cats.length - 1 - i < every && (cats.length - 1) % every) return;
      el("text", {x: X(i), y: H - 10, "text-anchor": "middle"}, svg).textContent = c;
    });
  }
  S.forEach((s, k) => {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (isNum(v)) { d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(+v).toFixed(1); pen = true; } else pen = false; });
    el("path", {d, class: `ln k${k + 1}`}, svg);
    if (cats.length <= 12) s.values.forEach((v, i) => { if (isNum(v) && cats.length <= 4) el("circle", {cx: X(i), cy: Y(+v), r: 4, class: `dot f${k + 1}`}, svg); });
    const li = last(s);
    if (li >= 0) el("circle", {cx: X(li), cy: Y(+s.values[li]), r: 4, class: `dot f${k + 1}`}, svg);
  });
  if (labelW) {
    const ends = S.map((s, k) => ({k, y: last(s) >= 0 ? Y(+s.values[last(s)]) : null, s})).filter(e => e.y !== null).sort((a, b) => a.y - b.y);
    const ok = ends.every((e, i) => i === 0 || e.y - ends[i - 1].y >= 14);
    if (ok) ends.forEach(e => {
      const li = last(e.s);
      const t = el("text", {x: X(li) + 8, y: e.y + 4, class: "lab"}, svg);
      t.textContent = S.length > 1 ? e.s.name : fmt(e.s.values[li], spec.format, spec.decimals);
    });
  }
  // hover: crosshair + all-series tooltip
  const tip = tooltip(box), guide = el("line", {y1: mt, y2: mt + ph, class: "guide", visibility: "hidden"}, svg);
  const marks = S.map((s, k) => el("circle", {r: 5, class: `dot f${k + 1}`, visibility: "hidden"}, svg));
  cats.forEach((c, i) => {
    // hit area: halfway to each neighbor (uneven on a date axis)
    const a = i ? (X(i - 1) + X(i)) / 2 : ml, b = i < cats.length - 1 ? (X(i) + X(i + 1)) / 2 : ml + pw;
    const hit = el("rect", {x: Math.min(a, X(i)), y: mt, width: Math.max(1, b - a), height: ph, class: "hit"}, svg);
    const on = ev => {
      guide.setAttribute("x1", X(i)); guide.setAttribute("x2", X(i)); guide.setAttribute("visibility", "visible");
      S.forEach((s, k) => { const v = s.values[i]; const m = marks[k];
        if (isNum(v)) { m.setAttribute("cx", X(i)); m.setAttribute("cy", Y(+v)); m.setAttribute("visibility", "visible"); } else m.setAttribute("visibility", "hidden"); });
      const [px, py] = pointer(ev, box);
      tip.show(`<b>${esc(c)}</b>` + S.map((s, k) => row(k + 1, s.name, fmt(s.values[i], spec.format, spec.decimals))).join(""), px, py);
    };
    hit.addEventListener("pointermove", on); hit.addEventListener("pointerdown", on);
    hit.addEventListener("pointerleave", () => { tip.hide(); guide.setAttribute("visibility", "hidden"); marks.forEach(m => m.setAttribute("visibility", "hidden")); });
  });
}

// ---------- bar charts: vertical/horizontal × grouped/stacked
function barPath(horiz, a0, a1, b0, b1, r) {
  // a = value axis from baseline a0 to data end a1; b = category axis b0..b1. Round only the data end.
  const len = Math.abs(a1 - a0), th = Math.abs(b1 - b0); r = Math.min(r, len, th / 2);
  const s = Math.sign(a1 - a0) || 1, e = a1, q = e - s * r;
  if (!horiz) return `M${b0},${a0}V${q}Q${b0},${e} ${b0 + r},${e}H${b1 - r}Q${b1},${e} ${b1},${q}V${a0}Z`;
  return `M${a0},${b0}H${q}Q${e},${b0} ${e},${b0 + r}V${b1 - r}Q${e},${b1} ${q},${b1}H${a0}Z`;
}
function barChart(box, spec, horiz, stacked) {
  const W = box.clientWidth, cats = spec.categories, S = spec.series, nS = S.length;
  const {ticks, lo, hi} = domain(spec, stacked, true);
  const GAP = 2, tip = tooltip(box);
  const valLabels = !stacked && nS * cats.length <= 24;
  let ml, mr, mt, mb, pw, ph, H, band, thick;
  if (horiz) {
    thick = stacked ? 22 : (nS > 3 ? 14 : 18);
    const groupT = stacked ? thick : nS * thick + (nS - 1) * GAP;
    const catW = Math.min(W * 0.38, Math.max(...cats.map(c => tw(c))) + 12);
    const lines = cats.map(c => wrap(c, catW - 12));
    band = Math.max(groupT + 16, Math.max(...lines.map(l => l.length)) * 14 + 10);
    ml = catW; mt = 6; mb = 26;
    const maxVal = valLabels ? Math.max(...S.flatMap(s => s.values.filter(isNum).map(v => tw(fmt(v, spec.format, spec.decimals))))) + 10 : 12;
    mr = Math.min(maxVal, W * 0.22);
    pw = W - ml - mr; ph = band * cats.length; H = mt + ph + mb;
    const svg = el("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`}, box);
    const V = v => ml + (v - lo) / (hi - lo) * pw;
    ticks.forEach(t => {
      el("line", {x1: V(t), x2: V(t), y1: mt, y2: mt + ph, class: Math.abs(t) < 1e-12 ? "base" : "grid"}, svg);
    });
    const tickEvery = Math.max(1, Math.ceil(ticks.length * (Math.max(...ticks.map(t => tw(axisFmt(t, spec.format)))) + 12) / pw));
    ticks.forEach((t, i) => { if (i % tickEvery === 0) el("text", {x: V(t), y: H - 8, "text-anchor": "middle"}, svg).textContent = axisFmt(t, spec.format); });
    cats.forEach((c, i) => {
      const cy = mt + i * band + band / 2;
      textLines(svg, lines[i], ml - 10, cy + 4 - (lines[i].length - 1) * 7, "end", "lab");
      let start = cy - groupT / 2, pos = 0, neg = 0;
      S.forEach((s, k) => {
        const v = s.values[i]; if (!isNum(v)) { if (!stacked) start += thick + GAP; return; }
        let a0, a1;
        if (stacked) { a0 = v >= 0 ? V(pos) : V(neg); if (v >= 0) pos += +v; else neg += +v; a1 = v >= 0 ? V(pos) - (k < nS - 1 ? GAP : 0) : V(neg); }
        else { a0 = V(0); a1 = V(+v); }
        const b0 = stacked ? cy - thick / 2 : start, b1 = b0 + thick;
        const topSeg = !stacked || S.slice(k + 1).every(t => !isNum(t.values[i]) || +t.values[i] === 0);
        const p = el("path", {d: barPath(true, a0, a1, b0, b1, topSeg ? 4 : 0), class: `bar f${k + 1}`}, svg);
        if (valLabels) el("text", {x: a1 + (v >= 0 ? 6 : -6), y: (b0 + b1) / 2 + 4, "text-anchor": v >= 0 ? "start" : "end", class: "lab"}, svg).textContent = fmt(v, spec.format, spec.decimals);
        const hit = el("rect", {x: ml, y: b0 - GAP / 2, width: pw, height: thick + GAP, class: "hit"}, svg);
        const on = ev => { const [px, py] = pointer(ev, box);
          tip.show(`<b>${esc(c)}</b>` + (stacked ? S.map((t, j) => row(j + 1, t.name, fmt(t.values[i], spec.format, spec.decimals))).join("") : row(k + 1, s.name, fmt(v, spec.format, spec.decimals))), px, py); p.classList.remove("dim"); };
        hit.addEventListener("pointermove", on); hit.addEventListener("pointerdown", on); hit.addEventListener("pointerleave", () => tip.hide());
        if (!stacked) start += thick + GAP;
      });
    });
    return;
  }
  // vertical
  H = W < 520 ? 260 : 320; mt = 18; mr = 8;
  ml = Math.max(...ticks.map(t => tw(axisFmt(t, spec.format)))) + 10;
  pw = W - ml - mr; band = pw / cats.length;
  const groupW = Math.min(band * 0.8, stacked ? 48 : nS * 24 + (nS - 1) * GAP);
  thick = stacked ? Math.min(48, band * 0.6) : Math.min(24, (groupW - (nS - 1) * GAP) / nS);
  // many categories (a monthly series): one-line labels, thinned so they never overlap
  const maxLab = Math.max(...cats.map(c => tw(c))) + 8, thin = cats.length > 12 && maxLab > band;
  const every = thin ? Math.ceil(maxLab / band) : 1;
  const lines = cats.map(c => thin ? [c] : wrap(c, band - 6));
  mb = Math.max(...lines.map(l => l.length)) * 14 + 14;
  ph = H - mt - mb;
  const svg = el("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`}, box);
  const V = v => mt + ph - (v - lo) / (hi - lo) * ph;
  ticks.forEach(t => {
    el("line", {x1: ml, x2: ml + pw, y1: V(t), y2: V(t), class: Math.abs(t) < 1e-12 ? "base" : "grid"}, svg);
    el("text", {x: ml - 8, y: V(t) + 4, "text-anchor": "end"}, svg).textContent = axisFmt(t, spec.format);
  });
  const capOk = valLabels && Math.max(...S.flatMap(s => s.values.filter(isNum).map(v => tw(fmt(v, spec.format, spec.decimals))))) < (nS === 1 ? band * 0.9 : thick + GAP + 6);
  cats.forEach((c, i) => {
    const cx = ml + i * band + band / 2;
    if (!thin || i % every === 0) textLines(svg, lines[i], cx, mt + ph + 18, "middle", "lab");
    const used = stacked ? thick : nS * thick + (nS - 1) * GAP;
    let start = cx - used / 2, pos = 0, neg = 0;
    S.forEach((s, k) => {
      const v = s.values[i]; if (!isNum(v)) { if (!stacked) start += thick + GAP; return; }
      let a0, a1;
      if (stacked) { a0 = v >= 0 ? V(pos) : V(neg); if (v >= 0) pos += +v; else neg += +v; a1 = v >= 0 ? V(pos) + (k < nS - 1 ? GAP : 0) : V(neg); }
      else { a0 = V(0); a1 = V(+v); }
      const b0 = stacked ? cx - thick / 2 : start, b1 = b0 + thick;
      const topSeg = !stacked || S.slice(k + 1).every(t => !isNum(t.values[i]) || +t.values[i] === 0);
      el("path", {d: barPath(false, a0, a1, b0, b1, topSeg ? 4 : 0), class: `bar f${k + 1}`}, svg);
      if (capOk) el("text", {x: (b0 + b1) / 2, y: v >= 0 ? a1 - 6 : a1 + 14, "text-anchor": "middle", class: "lab"}, svg).textContent = fmt(v, spec.format, spec.decimals);
      const hit = el("rect", {x: b0 - GAP / 2, y: mt, width: thick + GAP, height: ph, class: "hit"}, svg);
      const on = ev => { const [px, py] = pointer(ev, box);
        tip.show(`<b>${esc(c)}</b>` + (stacked ? S.map((t, j) => row(j + 1, t.name, fmt(t.values[i], spec.format, spec.decimals))).join("") : row(k + 1, s.name, fmt(v, spec.format, spec.decimals))), px, py); };
      hit.addEventListener("pointermove", on); hit.addEventListener("pointerdown", on); hit.addEventListener("pointerleave", () => tip.hide());
      if (!stacked) start += thick + GAP;
    });
  });
}

function legend(node, spec) {
  if (!spec || spec.series.length < 2) return;
  const line = spec.type === "line";
  node.innerHTML = spec.series.map((s, k) => `<span><i class="b${k + 1}${line ? " line" : ""}"></i>${esc(s.name)}</span>`).join("");
}

// ---------- table + CSV download
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== "");
}
function cell(v) {
  if (!isNum(v) || /^0\d/.test(v)) return esc(v);
  if (/^\+/.test(String(v).trim())) return "+" + cell(String(v).trim().slice(1));   // keep explicit + signs
  const n = +v;
  // keep the decimals the analysis wrote (80.0 stays 80.0), capped at three for unrounded values
  const written = (String(v).split(".")[1] || "").length, d = Math.min(written, 3);
  if (!written) return Math.abs(n) >= 10000 ? n.toLocaleString("en-US") : String(n);
  return n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
}
function table(node, csv) {
  const rows = parseCSV(csv); if (!rows.length) return;
  const [h, ...b] = rows;
  node.innerHTML = `<table><thead><tr>${h.map(x => `<th scope="col">${esc(x)}</th>`).join("")}</tr></thead><tbody>` +
    b.map(r => `<tr>${r.map(cell).map(x => `<td>${x}</td>`).join("")}</tr>`).join("") + "</tbody></table>";
}

function render(ex) {
  const box = document.querySelector(`[data-chart="${ex.id}"]`);
  if (!box) return;
  const spec = ex.chart;
  if (!spec) { box.style.display = "none"; return; }
  if (!box.clientWidth) {                     // not laid out yet: retry briefly (resize hooks also cover it)
    ex.tries = (ex.tries || 0) + 1;
    if (ex.tries < 40) setTimeout(() => render(ex), 100);
    return;
  }
  box.querySelectorAll("svg").forEach(s => s.remove());
  box.dataset.w = box.clientWidth;
  if (spec.type === "line") lineChart(box, spec);
  else barChart(box, spec, spec.type === "hbar" || spec.type === "stacked_h", spec.type === "stacked" || spec.type === "stacked_h");
}

(DATA || []).forEach(ex => {
  legend(document.querySelector(`[data-legend="${ex.id}"]`), ex.chart);
  table(document.querySelector(`[data-table="${ex.id}"]`), ex.csv);
  const btn = document.querySelector(`[data-download="${ex.id}"]`);
  if (btn) btn.addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([ex.csv], {type: "text/csv"}));
    const a = document.createElement("a"); a.href = url; a.download = ex.csv_name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  render(ex);
  const box = document.querySelector(`[data-chart="${ex.id}"]`);
  if (box && window.ResizeObserver) {
    let timer = 0;
    new ResizeObserver(() => { if (String(box.clientWidth) !== box.dataset.w) { clearTimeout(timer); timer = setTimeout(() => render(ex), 60); } }).observe(box);
  }
});
const ATTACH = /*__ATTACH__*/null;
(ATTACH || []).forEach(a => {
  const b = document.querySelector(`[data-attach="${a.id}"]`);
  if (b) b.addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([a.text], {type: "text/plain"}));
    const l = document.createElement("a"); l.href = url; l.download = a.name; l.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
});
const rerender = () => (DATA || []).forEach(ex => {
  const box = document.querySelector(`[data-chart="${ex.id}"]`);
  if (box && String(box.clientWidth) !== box.dataset.w) render(ex);
});
window.addEventListener("load", rerender);
window.addEventListener("resize", rerender);
window.addEventListener("beforeprint", () => { document.querySelectorAll("details").forEach(d => d.open = true); rerender(); });
})();
</script>
